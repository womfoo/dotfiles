name: build and cache

# Builds every package, devShell and NixOS host with the private `lihim`
# input swapped for the public stand-in `github:womfoo/fake`, and pushes
# results to attic.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cache-${{ github.ref }}
  cancel-in-progress: true

env:
  OVERRIDE: --override-input lihim github:womfoo/fake

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runs-on: ubuntu-24.04
          - system: aarch64-linux
            runs-on: ubuntu-24.04-arm
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-going = true
            accept-flake-config = true

      - if: github.repository == 'womfoo/dotfiles'
        uses: ryanccn/attic-action@v0
        with:
          endpoint: ${{ secrets.ATTIC_ENDPOINT }}
          cache: ${{ secrets.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}
          skip-push: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}

      - name: List targets
        id: targets
        run: |
          sys=${{ matrix.system }}
          # `default` on x86_64-linux is a bombon BOM of the aarch64 dreadfort system
          pkgs=$(nix eval $OVERRIDE --raw .#packages.$sys \
            --apply 'ps: builtins.concatStringsSep " " (builtins.attrNames (removeAttrs ps ["default"]))')
          shells=$(nix eval $OVERRIDE --raw .#devShells.$sys \
            --apply 'ss: builtins.concatStringsSep " " (builtins.attrNames ss)')
          targets=""
          for p in $pkgs; do targets="$targets .#packages.$sys.$p"; done
          for s in $shells; do targets="$targets .#devShells.$sys.$s"; done
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$targets" | tr ' ' '\n'

      - name: Build
        run: nix build $OVERRIDE --no-link --print-build-logs ${{ steps.targets.outputs.targets }}

  nixos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: dreadfort, runs-on: ubuntu-24.04-arm }
          - { host: dreamfyre, runs-on: ubuntu-24.04-arm }
          - { host: meleys, runs-on: ubuntu-24.04 }
          - { host: pentos, runs-on: ubuntu-24.04 }
          - { host: stonedoor, runs-on: ubuntu-24.04 }
          - { host: vhagar, runs-on: ubuntu-24.04 }
          - { host: waycastle, runs-on: ubuntu-24.04 }
    name: nixos-${{ matrix.host }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-going = true
            accept-flake-config = true

      - if: github.repository == 'womfoo/dotfiles'
        uses: ryanccn/attic-action@v0
        with:
          endpoint: ${{ secrets.ATTIC_ENDPOINT }}
          cache: ${{ secrets.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}
          skip-push: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}

      - name: Build
        run: |
          nix build $OVERRIDE --no-link --print-build-logs \
            .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
